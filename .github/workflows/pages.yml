name: Pages

# Builds and deploys the VitePress site (docs/) to GitHub Pages, at https://openbv.emdzej.pl/ (the custom
# domain's CNAME ships in docs/public/CNAME). The home page's background is a small gasm game
# (tools/site-bg, two babos dueling), built by docs/scripts/build-bg.sh and run by @emdzej/gasm-host, whose
# copy under /play/ docs/scripts/vendor-web.sh makes from the pinned npm package.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/site-bg/**'
      - 'tools/fetch-gasm-sdk.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # lastUpdated timestamps

      - name: fetch wasi-sdk and the gasm C SDK
        run: tools/fetch-gasm-sdk.sh

      - name: build the background game
        run: docs/scripts/build-bg.sh

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: install
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: build VitePress site
        working-directory: docs
        run: |
          scripts/vendor-web.sh
          pnpm build
          test -f .vitepress/dist/play/build/babos.wasm
          test -f .vitepress/dist/CNAME

      - uses: actions/configure-pages@v6

      - name: upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
