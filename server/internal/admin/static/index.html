<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openbv server</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 2rem; background: #0f141b; color: #e6e9ee; }
  h1 { font-size: 1.3rem; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid #ffffff14; }
  button, input, select { font: inherit; background: #1c2430; color: inherit; border: 1px solid #ffffff22; border-radius: 4px; padding: .3rem .6rem; }
  button.primary { background: #ff8c1a; color: #111; border-color: #ff8c1a; }
  form { display: flex; gap: .5rem; flex-wrap: wrap; align-items: end; }
  label { display: flex; flex-direction: column; font-size: .8rem; color: #9aa4b2; }
  .err { color: #ff6b6b; }
</style>
</head>
<body>
<h1>openbv server</h1>
<p>Sessions on this server. A session is a game server of its own: players join it with the game's
Game Browser or by its address.</p>
<form id="create">
  <label>Name <input name="name" value="Babo Violent 2 - Server" required></label>
  <label>Game type <select name="gameType">
    <option value="0">Free for all</option><option value="1">Team deathmatch</option>
    <option value="2">Capture the flag</option><option value="3">Champion</option></select></label>
  <label>Max players <input name="maxPlayers" type="number" value="16" min="1" max="32"></label>
  <label>Port <input name="port" type="number" value="3333" min="1024" max="65535"></label>
  <label>Maps (comma-separated) <input name="maps" value="CTF-Daivuk"></label>
  <label>Password <input name="password" type="password"></label>
  <button class="primary">Create session</button>
</form>
<p id="error" class="err"></p>
<table><thead><tr><th>Session</th><th>Name</th><th>Type</th><th>Port</th><th>Players</th><th></th></tr></thead>
<tbody id="sessions"></tbody></table>
<script>
const types = ['Free for all', 'Team deathmatch', 'Capture the flag', 'Champion']
let token = sessionStorage.getItem('openbv-admin-token')
if (!token) { token = prompt('Admin token'); sessionStorage.setItem('openbv-admin-token', token || '') }
async function api(method, path, body) {
  const r = await fetch('/admin/api' + path, { method, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) })
  if (r.status === 401) { sessionStorage.removeItem('openbv-admin-token'); throw new Error('wrong token: reload to enter it again') }
  if (!r.ok) throw new Error((await r.json()).error || r.statusText)
  return r.status === 204 ? null : r.json()
}
function show(e) { document.getElementById('error').textContent = e ? e.message : '' }
async function refresh() {
  try {
    const list = await api('GET', '/sessions')
    const tb = document.getElementById('sessions')
    tb.replaceChildren(...list.map(s => {
      const tr = document.createElement('tr')
      for (const v of [s.id, s.settings.name, types[s.settings.gameType] || s.settings.gameType, s.settings.port || '-', s.players.map(p => p.name).join(', ') || 'none'])
        tr.append(Object.assign(document.createElement('td'), { textContent: v }))
      const stop = Object.assign(document.createElement('button'), { textContent: 'Stop' })
      stop.onclick = async () => { if (confirm('Stop ' + s.settings.name + '?')) { try { await api('DELETE', '/sessions/' + s.id); refresh() } catch (e) { show(e) } } }
      const td = document.createElement('td'); td.append(stop); tr.append(td)
      return tr
    }))
    show()
  } catch (e) { show(e) }
}
document.getElementById('create').onsubmit = async ev => {
  ev.preventDefault()
  const f = new FormData(ev.target)
  try {
    await api('POST', '/sessions', { name: f.get('name'), gameType: +f.get('gameType'), maxPlayers: +f.get('maxPlayers'), port: +f.get('port'),
      maps: f.get('maps').split(',').map(s => s.trim()).filter(Boolean), password: f.get('password') })
    refresh()
  } catch (e) { show(e) }
}
refresh(); setInterval(refresh, 3000)
</script>
</body>
</html>
